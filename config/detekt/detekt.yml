# Overrides on top of detekt's default config (buildUponDefaultConfig = true).
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
style:
  MagicNumber:
    excludes: ['**/test/**', '**/commonTest/**', '**/jvmTest/**']
    # A named property already says what its number means; UI sizes and colours live in them.
    ignorePropertyDeclaration: true

complexity:
  # A protocol mapper has one small function per message type; splitting it across classes
  # would scatter one protocol over several files.
  TooManyFunctions:
    allowedFunctionsPerClass: 25
    allowedFunctionsPerFile: 25
