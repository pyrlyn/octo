org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
kotlin.daemon.jvmargs=-Xmx4g
kotlin.incremental.native=true
kotlin.code.style=official
# Apple targets cannot be built on Linux or Windows hosts; skip them there instead of failing.
kotlin.native.ignoreDisabledTargets=true
# Set to true (or -Pocto.allNativeTargets=true) to build macosArm64, linuxX64 and mingwX64 on any host.
octo.allNativeTargets=false

# hotRun needs a JetBrains Runtime of the toolchain's version (25); let the plugin download it into
# ~/.gradle instead of asking everyone to install one. Experimental in Compose Hot Reload 1.2.0.
compose.reload.jbr.autoProvisioningEnabled=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
