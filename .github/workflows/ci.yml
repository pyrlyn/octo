name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Shared builds from github.com/pyrlyn/packages, checked out below; absolute, since the
      # included kotlin-wasm build reads the same variables relative to its own directory.
      SHARED_SETTINGS_DIR: ${{ github.workspace }}/packages/shared-settings
      KOTLIN_WASM_DIR: ${{ github.workspace }}/packages/kotlin-wasm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: pyrlyn/packages
          # Pinned release tag; bump when octo needs newer shared builds.
          ref: 0.0.1
          path: packages
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6.4.0
      # Builds every native target the host can build, so commonMain stays free of JVM-only code.
      - run: ./gradlew check -Pocto.allNativeTargets=true --console=plain
